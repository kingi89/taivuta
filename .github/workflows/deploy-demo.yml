name: Deploy Demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build distribution bundles
        run: npm run build

      - name: Prepare demo site
        run: |
          mkdir -p _site/dist/preferences _site/preferences
          cp demo/index.html _site/index.html
          # Provide both structured dist/ paths and root fallbacks
          cp -r dist/index.global.js* _site/dist/
          cp -r dist/index.global.js* _site/
          cp -r dist/preferences/index.global.js* _site/dist/preferences/
          cp -r dist/preferences/index.global.js* _site/preferences/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
